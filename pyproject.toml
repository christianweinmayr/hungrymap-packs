[project]
name = "packs"
version = "0.1.0"
description = "Builds Hungry Map OSM food-POI download packs from Geofabrik extracts"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0"]

[project.scripts]
packs = "packs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
